<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRS Acquisition Intelligence</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#111722;--card:#141b26;--card2:#19212e;--line:#232c3a;
    --text:#e6edf3;--muted:#8b98a9;--dim:#5b6675;
    --green:#3fb950;--green-bg:#0e2a18;--amber:#d29922;--amber-bg:#2b220a;
    --blue:#58a6ff;--blue-bg:#0d2136;--red:#f85149;--red-bg:#2b1211;--violet:#a371f7;--violet-bg:#1e1533;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .app{max-width:1180px;margin:0 auto;padding:34px 30px 70px}
  a{color:inherit;text-decoration:none}

  /* header */
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:30px}
  .greet{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .greet h1{font-size:27px;font-weight:700;letter-spacing:-.3px}
  .badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #23502f;color:var(--green);
    background:var(--green-bg);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
  .hbtns{display:flex;align-items:center;gap:10px}
  .stamp{color:var(--dim);font-size:12px;text-align:right}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(63,185,80,.15)}
  button.btn{display:inline-flex;align-items:center;gap:7px;background:var(--card2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  button.btn:hover{background:#212b3a;border-color:#2f3b4d}
  button.btn.green{background:#12331f;border-color:#1f5130;color:#4ad167}
  button.btn.green:hover{background:#164025}
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:12px}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 15px;
    display:flex;justify-content:space-between;align-items:flex-start;min-height:98px}
  .kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-size:30px;font-weight:700;margin-top:10px;letter-spacing:-.5px}
  .kpi .iconbox{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .iconbox svg{width:19px;height:19px}
  .t-green{color:var(--green)}.t-amber{color:var(--amber)}.t-blue{color:var(--blue)}.t-violet{color:var(--violet)}.t-red{color:var(--red)}
  .b-green{background:var(--green-bg);color:var(--green)}.b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-blue{background:var(--blue-bg);color:var(--blue)}.b-violet{background:var(--violet-bg);color:var(--violet)}
  .b-red{background:var(--red-bg);color:var(--red)}.b-grey{background:#1c2430;color:var(--muted)}

  /* section headers */
  .sec{display:flex;align-items:center;gap:10px;margin:32px 0 14px}
  .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700}
  .pill-count{background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
  .sec .right{margin-left:auto;font-size:12.5px;color:var(--muted)}

  /* cards / panels */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .empty{padding:20px;color:var(--dim);font-size:13.5px;font-style:italic;background:var(--card);
    border:1px dashed var(--line);border-radius:var(--radius)}

  /* funnel */
  .funnel{padding:18px 20px}
  .frow{display:flex;align-items:center;gap:14px;margin-bottom:11px}
  .frow:last-child{margin-bottom:0}
  .flab{width:150px;font-size:13px;color:var(--muted);text-align:right;flex-shrink:0}
  .fbar{flex:1;background:#0e141d;border:1px solid var(--line);border-radius:7px;height:26px;overflow:hidden}
  .ffill{height:100%;background:linear-gradient(90deg,#1f6f37,#3fb950);display:flex;align-items:center;
    justify-content:flex-end;padding-right:10px;color:#eafff0;font-size:12px;font-weight:700;min-width:28px}
  .fnum{width:34px;font-size:13px;font-weight:700;flex-shrink:0}

  /* tables */
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
  thead th{background:var(--card2);color:var(--muted);text-align:left;font-size:11px;font-weight:600;
    letter-spacing:.4px;text-transform:uppercase;padding:11px 15px;border-bottom:1px solid var(--line)}
  tbody td{padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text);
    overflow:hidden;text-overflow:ellipsis}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--card2)}
  td.firm{font-weight:600}
  td.phone{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  td.wrap{white-space:normal;color:var(--muted)}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .p-int{background:var(--green-bg);color:#4ad167}.p-meet{background:var(--blue-bg);color:var(--blue)}
  .p-cb{background:var(--amber-bg);color:var(--amber)}.p-no{background:var(--red-bg);color:var(--red)}
  .p-na{background:#1c2430;color:var(--muted)}

  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .minicard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .minicard .v{font-size:26px;font-weight:700}
  .minicard .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:5px;font-weight:600}

  .err{background:var(--amber-bg);color:#e5b567;border:1px solid #4a3a12;border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:18px}
  .err.bad{background:var(--red-bg);color:#f4a09b;border-color:#5a201d}
  .foot{color:var(--dim);font-size:11.5px;text-align:center;margin-top:36px;border-top:1px solid var(--line);padding-top:18px}

  /* gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 40px;width:360px;text-align:center}
  #gate .lg{width:52px;height:52px;border-radius:13px;background:var(--green-bg);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  #gate h3{font-size:20px;margin-bottom:5px}
  #gate p{color:var(--muted);font-size:13px;margin-bottom:20px}
  #gate input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-size:14px;margin-bottom:12px;outline:none}
  #gate input:focus{border-color:#2f5130}
  #gate button{width:100%;background:#12331f;color:#4ad167;border:1px solid #1f5130;border-radius:10px;
    padding:12px;font-size:14px;font-weight:700;cursor:pointer}
  #gate button:hover{background:#164025}
  #gate .msg{color:var(--red);font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="lg"><svg class="ic" style="width:26px;height:26px" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z"/></svg></div>
    <h3>PRS &amp; Associates</h3>
    <p>Acquisition Intelligence Dashboard</p>
    <input id="pw" type="password" placeholder="Access code" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">View Dashboard</button>
    <div class="msg" id="gatemsg"></div>
  </div>
</div>

<div class="app">
  <div class="head">
    <div>
      <div class="greet">
        <h1 id="greeting">Good afternoon</h1>
        <span class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z"/></svg>PRS &amp; Associates</span>
      </div>
      <div class="sub" id="subline">Acquisition Campaign · Vadodara</div>
    </div>
    <div class="hbtns">
      <div class="stamp"><span class="dot"></span><span id="live">Live</span><div id="updated" style="margin-top:3px"></div></div>
      <button class="btn green" onclick="loadAll()"><svg class="ic" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M20.5 9a9 9 0 0 0-15-3L1 10m22 4l-4.5 4a9 9 0 0 1-15-3"/></svg>Refresh</button>
    </div>
  </div>

  <div id="errbox"></div>

  <div class="kpis" id="kpis"></div>

  <div class="sec"><h2>Acquisition Funnel</h2></div>
  <div class="panel funnel" id="funnel"></div>

  <div class="sec"><h2>Today's Calling</h2><span class="pill-count" id="todayCount">0</span></div>
  <div id="today"></div>

  <div class="grid2">
    <div>
      <div class="sec"><h2>Interested Firms</h2><span class="pill-count" id="intCount">0</span></div>
      <div id="interested"></div>
    </div>
    <div>
      <div class="sec"><h2>Google Meet Pipeline</h2></div>
      <div id="meet"></div>
    </div>
  </div>

  <div class="sec"><h2>Meeting Ready</h2><span class="pill-count" id="mrCount">0</span></div>
  <div id="meetingready"></div>

  <div class="sec"><h2>Callbacks Scheduled</h2><span class="pill-count" id="cbCount">0</span></div>
  <div id="callbacks"></div>

  <div class="sec"><h2>Follow-up Pipeline</h2><span class="pill-count" id="fuCount">0</span></div>
  <div id="followup"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* ===== CONFIG ===== */
const SHEET_ID="12b4Lfj5qDZahwFLcw7r-MSsv83NiFgRgT4pjhxIOxU0";
const TAB="Calling Queue";
const ACCESS_CODE="prs2026";
const REFRESH_MINUTES=10;
const COL={firm:"Firm Name",phone:"Primary Phone",partner:"Managing Partner",status:"Call Status",
  attempt:"Attempt",date:"Call Date",disposition:"Disposition",next:"Next Action",callback:"Callback",
  owner:"Owner",notes:"Notes",approved:"Approved"};

/* ===== icons ===== */
const IC={
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  star:'<path d="M12 2l3 6.3 6.9 1-5 4.9 1.2 6.8-6.1-3.2-6.1 3.2 1.2-6.8-5-4.9 6.9-1z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  trend:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>'
};
function svg(p){return '<svg class="ic" viewBox="0 0 24 24">'+p+'</svg>';}

/* ===== gate ===== */
function checkPw(){const v=document.getElementById('pw').value.trim();
  if(v===ACCESS_CODE){document.getElementById('gate').style.display='none';loadAll();}
  else document.getElementById('gatemsg').textContent='Incorrect access code.';}

/* ===== data ===== */
let _n=0;
function loadTab(name){return new Promise((res,rej)=>{
  const cb='__gv'+(_n++);
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?sheet="+encodeURIComponent(name)+
    "&headers=1&range=A2:Z3000&tqx=responseHandler:"+cb;
  const s=document.createElement('script');let done=false;
  window[cb]=r=>{done=true;try{res(parse(r));}catch(e){rej(e);}delete window[cb];s.remove();};
  s.onerror=()=>{if(!done){rej(new Error('Could not reach the sheet.'));s.remove();}};
  s.src=url;document.body.appendChild(s);
  setTimeout(()=>{if(!done)rej(new Error('Timed out loading the sheet.'));},15000);
});}
function parse(r){const t=r.table,cols=t.cols.map(c=>(c.label||'').trim());
  const rows=t.rows.map(row=>{const o={};(row.c||[]).forEach((c,i)=>{o[cols[i]||('c'+i)]=c?(c.f!=null?c.f:c.v):'';});return o;});
  return{cols,rows};}
function col(row,cols,want){const w=want.toLowerCase();const k=cols.find(c=>c&&c.toLowerCase().includes(w));
  return k?(row[k]==null?'':String(row[k]).trim()):'';}
const isSet=v=>v&&String(v).trim()!=='';
function sameDay(v){if(!v)return false;const d=new Date(v);if(isNaN(d)){const t=new Date();const s=String(v);
  return[t.getDate()+'/'+(t.getMonth()+1),(t.getMonth()+1)+'/'+t.getDate()].some(o=>s.includes(o));}
  const t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();}
function withinDays(v,n){if(!v)return false;const d=new Date(v);if(isNaN(d))return false;
  const diff=(Date.now()-d.getTime())/86400000;return diff>=0&&diff<=n;}

/* ===== render ===== */
function kpi(val,lab,tone){return '<div class="kpi"><div><div class="lab">'+lab+'</div><div class="val t-'+tone+'">'+val+'</div></div>'+
  '<div class="iconbox b-'+tone+'">'+svg(IC[kpiIcon(lab)]||IC.trend)+'</div></div>';}
function kpiIcon(l){l=l.toLowerCase();if(l.includes('call'))return'phone';if(l.includes('interest'))return'star';
  if(l.includes('meeting')||l.includes('meet'))return'video';if(l.includes('follow'))return'clock';
  if(l.includes('callback'))return'clock';if(l.includes('week')||l.includes('rate'))return'trend';
  if(l.includes('approved'))return'check';return'trend';}
function pill(d){const x=(d||'').toLowerCase();
  if(x.includes('interest')&&!x.includes('not'))return'<span class="pill p-int">Interested</span>';
  if(x.includes('meeting'))return'<span class="pill p-meet">Meeting Agreed</span>';
  if(x.includes('callback'))return'<span class="pill p-cb">Callback</span>';
  if(x.includes('no answer')||x.includes('busy'))return'<span class="pill p-no">'+d+'</span>';
  if(x.includes('not interest'))return'<span class="pill p-na">Not Interested</span>';
  return d?'<span class="pill p-na">'+d+'</span>':'';}

function table(widths,head,rows,classes){
  const cg='<colgroup>'+widths.map(w=>'<col style="width:'+w+'">').join('')+'</colgroup>';
  return '<div class="panel"><table>'+cg+'<thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((c,i)=>'<td class="'+(classes[i]||'')+'">'+(c||'')+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';}

function render(data){
  const {cols,rows}=data;
  const all=rows.filter(r=>isSet(col(r,cols,COL.firm)));
  const approved=all.filter(r=>{const a=col(r,cols,COL.approved).toLowerCase();
    return a==='yes'||a==='y'||a==='approved'||a==='true'||a==='1';});
  const usingMarker=approved.length>0;
  const R=usingMarker?approved:all;
  const d=r=>col(r,cols,COL.disposition).toLowerCase();
  const remark=r=>col(r,cols,COL.notes)||col(r,cols,COL.next);
  const worked=R.filter(r=>isSet(col(r,cols,COL.disposition)));
  const interested=R.filter(r=>d(r).includes('interest')&&!d(r).includes('not'));
  const meeting=R.filter(r=>d(r).includes('meeting'));
  const callbacks=R.filter(r=>d(r).includes('callback'));
  const followups=R.filter(r=>d(r).includes('no answer')||d(r).includes('busy'));
  const notInt=R.filter(r=>d(r).includes('not interest'));
  const callsToday=R.filter(r=>sameDay(col(r,cols,COL.date)));
  const callsWeek=R.filter(r=>withinDays(col(r,cols,COL.date),7));
  const answered=interested.length+meeting.length+callbacks.length+notInt.length;
  const connRate=worked.length?Math.round(100*answered/worked.length):0;

  document.getElementById('errbox').innerHTML='';

  document.getElementById('kpis').innerHTML=[
    kpi(R.length,'Approved','green'),
    kpi(worked.length,'Contacted','blue'),
    kpi(interested.length,'Interested','green'),
    kpi(callbacks.length,'Callbacks','amber'),
    kpi(meeting.length,'Meeting Ready','violet'),
    kpi(connRate+'%','Connect Rate','green')
  ].join('');

  const total=R.length||1;
  const stages=[['Approved (call list)',R.length],['Contacted',worked.length],['Interested',interested.length],
    ['Meeting Agreed',meeting.length]];
  document.getElementById('funnel').innerHTML=stages.map(s=>{
    const pct=Math.max(4,Math.round(100*s[1]/total));
    return '<div class="frow"><div class="flab">'+s[0]+'</div><div class="fbar"><div class="ffill" style="width:'+pct+'%">'+s[1]+'</div></div><div class="fnum">'+s[1]+'</div></div>';
  }).join('');

  document.getElementById('todayCount').textContent=callsToday.length;
  document.getElementById('today').innerHTML=callsToday.length? table(
    ['24%','16%','13%','11%','13%','23%'],
    ['Firm','Partner','Call Status','Date','Outcome','Remark'],
    callsToday.map(r=>[col(r,cols,COL.firm),col(r,cols,COL.partner),col(r,cols,COL.status),
      col(r,cols,COL.date),pill(col(r,cols,COL.disposition)),remark(r)]),
    ['firm','','','phone','','wrap']
  ):'<div class="empty">No calls logged today yet.</div>';

  document.getElementById('intCount').textContent=interested.length;
  document.getElementById('interested').innerHTML=interested.length? table(
    ['30%','20%','20%','30%'],
    ['Firm','Partner','Phone','Remark'],
    interested.map(r=>[col(r,cols,COL.firm),col(r,cols,COL.partner)||'—',col(r,cols,COL.phone),remark(r)]),
    ['firm','','phone','wrap']
  ):'<div class="empty">No interested firms yet.</div>';

  document.getElementById('meet').innerHTML=
    '<div class="mini"><div class="minicard"><div class="v t-violet">'+meeting.length+'</div><div class="l">Meeting Ready</div></div>'+
    '<div class="minicard"><div class="v t-green">'+interested.length+'</div><div class="l">Interested</div></div></div>';

  document.getElementById('mrCount').textContent=meeting.length;
  document.getElementById('meetingready').innerHTML=meeting.length? table(
    ['28%','20%','52%'],
    ['Firm','Phone','Remark'],
    meeting.map(r=>[col(r,cols,COL.firm),col(r,cols,COL.phone),remark(r)]),
    ['firm','phone','wrap']
  ):'<div class="empty">Meetings will appear here as they are booked.</div>';

  document.getElementById('cbCount').textContent=callbacks.length;
  document.getElementById('callbacks').innerHTML=callbacks.length? table(
    ['30%','20%','22%','28%'],
    ['Firm','Phone','Scheduled For','Note'],
    callbacks.map(r=>[col(r,cols,COL.firm),col(r,cols,COL.phone),
      col(r,cols,COL.callback)&&col(r,cols,COL.callback).toLowerCase()!=='not given'?col(r,cols,COL.callback):'To be confirmed',
      remark(r)]),
    ['firm','phone','','wrap']
  ):'<div class="empty">No callbacks scheduled yet.</div>';

  document.getElementById('fuCount').textContent=followups.length;
  document.getElementById('followup').innerHTML=followups.length? table(
    ['24%','16%','15%','12%','9%','24%'],
    ['Firm','Partner','Phone','Last Status','Attempt','Remark'],
    followups.map(r=>[col(r,cols,COL.firm),col(r,cols,COL.partner)||'—',col(r,cols,COL.phone),
      pill(col(r,cols,COL.disposition)),col(r,cols,COL.attempt),remark(r)]),
    ['firm','','phone','','','wrap']
  ):'<div class="empty">No firms awaiting follow-up.</div>';

  const h=new Date().getHours();
  document.getElementById('greeting').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening');
  document.getElementById('subline').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · Acquisition Campaign, Vadodara';
  document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  document.getElementById('foot').textContent='PRS Acquisition Intelligence · live from the CRM · single source of truth is the BTN operations sheet.';
}

async function loadAll(){
  document.getElementById('live').textContent='Refreshing…';
  try{ render(await loadTab(TAB)); document.getElementById('live').textContent='Live'; }
  catch(e){
    document.getElementById('errbox').innerHTML='<div class="err bad"><b>Couldn’t load data.</b> '+e.message+
      ' Ensure the sheet is shared as "Anyone with the link – Viewer" and the tab is named "'+TAB+'".</div>';
    document.getElementById('live').textContent='Offline';
  }
}
setInterval(loadAll,REFRESH_MINUTES*60*1000);
</script>
